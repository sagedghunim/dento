{% load i18n hamada %}
<fieldset class="group">
  <legend>{% translate "Doctor" %}</legend>
  <div class="chips" data-doctors>{% for d in config.doctors %}<label class="chip" data-sections="{{ d.sections|join:',' }}"><input type="radio" name="doctor" value="{{ d.id }}"><span><bdi dir="auto">{{ d.name }}</bdi></span></label>{% endfor %}</div>
</fieldset>
<fieldset class="group">
  <legend>{% translate "Day" %}</legend>
  <div class="chips">
    {% for c in day_choices %}<label class="chip"><input type="radio" name="day" value="{{ c.value }}"{% if forloop.first %} checked{% endif %}><span>{{ c.label }}</span></label>{% endfor %}
    <label class="chip"><input type="radio" name="day" value="other"><span>{% translate "Another day" %}</span></label>
  </div>
  <label class="field" data-other-day hidden>{% translate "Date" %}
    <input type="date" name="other_day" min="{{ config.today }}" max="{{ config.last_day }}">
  </label>
</fieldset>
<fieldset class="group" data-time>
  <legend>{% translate "Time" %}</legend>
  <p class="muted" data-time-status role="status"></p>
  <div class="slots" data-slots></div>
  <label class="check" data-extra hidden><input type="checkbox" name="extra"> {% translate "Add as an extra booking on a taken time" %}</label>
</fieldset>
