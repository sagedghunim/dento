{# The doctor's price list as <option>s, grouped by its sections (Saged, 2026-11-22): Book and Walk-in. #}{% regroup config.services by group as groups %}{% for g in groups %}{% if g.grouper %}<optgroup label="{{ g.grouper }}">{% for s in g.list %}{% if s.booking and s.kind == "procedure" %}<option value="{{ s.id }}" data-section="{{ s.section_id|default_if_none:'' }}" data-kind="{{ s.kind }}" data-unit="{{ s.unit }}" data-family="{{ s.family }}">{{ s.name }}</option>{% endif %}{% endfor %}</optgroup>{% endif %}{% endfor %}
